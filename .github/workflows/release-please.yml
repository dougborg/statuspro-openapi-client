name: Release Please

# The only workflow that watches pushes to main for release purposes.
# It never pushes to main itself - it only opens/updates a PR (the
# aggregated release PR) or, once that PR has been merged, creates the
# GitHub Releases + tags at the merge commit. See docs/RELEASE.md.
on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      tags: ${{ steps.tags.outputs.tags }}
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Mint GitHub App installation token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.RELEASE_PLEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}

      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # release-please creates DRAFT releases, and a draft release has no git
      # tag until it is published - so publishing cannot be tag-triggered.
      # Collect the tags it just created and hand them to publish.yml directly.
      # The root package (path ".") reports its tag as plain `tag_name`; the
      # others as `<path>--tag_name`.
      - name: Collect released tags
        id: tags
        if: steps.release.outputs.releases_created == 'true'
        env:
          RELEASE_OUTPUTS: ${{ toJSON(steps.release.outputs) }}
        run: |
          set -euo pipefail
          tags=$(printf '%s' "$RELEASE_OUTPUTS" \
            | jq -c '[to_entries[] | select(.key == "tag_name" or (.key | endswith("--tag_name"))) | .value | select(. != null and . != "")] | unique')
          echo "Tags to publish: $tags"
          echo "tags=$tags" >> "$GITHUB_OUTPUT"

  publish:
    needs: release-please
    if: needs.release-please.outputs.releases_created == 'true'
    strategy:
      # One call per released component; never cancel a publish mid-flight.
      fail-fast: false
      matrix:
        tag: ${{ fromJSON(needs.release-please.outputs.tags) }}
    permissions:
      contents: write
      id-token: write
      packages: write
    uses: ./.github/workflows/publish.yml
    with:
      tag: ${{ matrix.tag }}
    secrets: inherit
