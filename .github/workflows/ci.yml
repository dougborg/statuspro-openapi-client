name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

# Cancel in-progress runs when a new workflow with the same group name is triggered
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Detect if code changes warrant full CI run
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            code:
              - '!docs/**'
              - '!mkdocs.yml'
              - '!*.md'
              - '!LICENSE'
              - '!.github/copilot-instructions.md'
              - '!.github/pull_request_template.md'
              - '!.github/agents/**'
              - '!.github/instructions/**'
              - '!.github/prompts/**'

  test:
    needs: changes
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false  # Don't cancel other matrix jobs if one fails
      matrix:
        python-version: ["3.12", "3.13", "3.14"]

    steps:
      - name: Skip for docs-only changes
        if: needs.changes.outputs.code == 'false'
        run: echo "Skipping tests for documentation-only changes"

      - name: Checkout code
        if: needs.changes.outputs.code == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        if: needs.changes.outputs.code == 'true'
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          python-version: ${{ matrix.python-version }}

      - name: Install pnpm
        if: needs.changes.outputs.code == 'true'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Install Node.js
        if: needs.changes.outputs.code == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        if: needs.changes.outputs.code == 'true'
        run: |
          uv sync --all-extras
          pnpm install --frozen-lockfile

      - name: Check code formatting
        if: needs.changes.outputs.code == 'true'
        run: uv run poe format-check

      - name: Run linting and type checking
        if: needs.changes.outputs.code == 'true'
        run: uv run poe lint

      - name: Run tests
        if: needs.changes.outputs.code == 'true'
        run: uv run poe test-coverage

      - name: Upload coverage to Codecov
        if: needs.changes.outputs.code == 'true'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: coverage.xml
          fail_ci_if_error: false

  quality:
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - name: Skip for docs-only changes
        if: needs.changes.outputs.code == 'false'
        run: echo "Skipping quality checks for documentation-only changes"

      - name: Checkout code
        if: needs.changes.outputs.code == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        if: needs.changes.outputs.code == 'true'
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          python-version: "3.14"

      - name: Install dependencies
        if: needs.changes.outputs.code == 'true'
        run: uv sync --all-extras

      - name: Validate OpenAPI specification
        if: needs.changes.outputs.code == 'true'
        run: uv run poe validate-openapi

      - name: Build documentation
        if: needs.changes.outputs.code == 'true'
        run: uv run poe docs-build
        env:
          CI_DOCS_BUILD: "true"

      - name: Test documentation
        if: needs.changes.outputs.code == 'true'
        run: uv run poe test-docs
        env:
          CI_DOCS_BUILD: "true"
